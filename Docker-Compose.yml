services:
  e-commerce:
    image: ecommerce:0.1
    container_name: e-commerce-con
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-con:3306/ecommerce
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass
      SPRING_DATASOURCE_DATABASE: ecommerce
      REDIS_CONTAINER: redis-con
    ports:
      - "8081:8081"
    networks:
      - "e-commerce-network"
    depends_on:
      - "mysql"
      - "redis"

  redis:
    image: redis:latest
    container_name: redis-container
    ports:
      - "6379:6379"
    volumes:
      - "redis_data:/data"
  mysql:
    image: mysql
    container_name: mysql-con
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 3309:3306
    volumes:
      - ecommerce-mysql-data-new:/var/lib/mysql
    networks:
      - "e-commerce-network"

volumes:
  redis_data:
  ecommerce-mysql-data-new:

networks:
  e-commerce-network:
    driver: bridge