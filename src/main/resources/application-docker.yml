spring:
  application:
    name: E-Commerce
  datasource:
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    url: ${SPRING_DATASOURCE_URL}
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_CONTAINER}
      port: 6379
server:
  port: 8081